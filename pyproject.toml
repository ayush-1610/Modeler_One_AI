[project]
name = "modeler-one"
version = "0.1.0"
description = "Modeler One workspace root"
requires-python = ">=3.12"
dependencies = [
  "pbpk-domain",
  "modeler-intake",
  "modeler-contracts",
  "modeler-api",
  "modeler-orchestrator",
  "modeler-engine-worker",
  "modeler-agents",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/pbpk-domain",
  "packages/data-intake",
  "packages/run-contracts",
  "services/api",
  "services/orchestrator",
  "services/engine-worker",
  "services/agents",
]

[tool.uv.sources]
pbpk-domain = { workspace = true }
modeler-intake = { workspace = true }
modeler-contracts = { workspace = true }
modeler-api = { workspace = true }
modeler-orchestrator = { workspace = true }
modeler-engine-worker = { workspace = true }
modeler-agents = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
  "packages/pbpk-domain/tests",
  "packages/data-intake/tests",
  "packages/run-contracts/tests",
  "services/api/tests",
  "services/engine-worker/tests",
  "services/agents/tests",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
ignore = ["C408"]  # dict(key=value) reads better for keyword-heavy test fixtures

[tool.ruff.lint.isort]
known-first-party = ["pbpk_domain", "modeler_intake","modeler_contracts", "modeler_api", "modeler_orchestrator", "modeler_engine", "modeler_agents"]
