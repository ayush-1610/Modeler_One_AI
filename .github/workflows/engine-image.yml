name: Engine image

# Build, qualify, sign and register the OSP engine image (task T-12, ENGINEERING_PLAN §9).
# The golden scripts run INSIDE the freshly built image and are the qualification gate: on a pull request
# they must pass but nothing is published, so a change that breaks a golden test can never publish an image.
# On main / tags the qualified image is pushed to GHCR by digest, an SBOM is attached, the image is signed
# with cosign (keyless), and an engine_images registration record is produced as a validation artifact.

on:
  push:
    branches: [main]
    tags: ["engine-*"]
    paths:
      - "services/engine-worker/**"
      - "packages/run-contracts/**"
      - ".github/workflows/engine-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/engine-worker/**"
      - "packages/run-contracts/**"
      - ".github/workflows/engine-image.yml"
  workflow_dispatch:

concurrency:
  group: engine-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/modeler-engine
  DOCKERFILE: services/engine-worker/Dockerfile

jobs:
  build-qualify:
    name: Build, qualify (golden), publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write        # cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Build engine image (amd64)
        run: docker build --platform linux/amd64 -f "$DOCKERFILE" -t modeler-engine:ci .

      - name: Qualify — golden scripts inside the image (the publish gate)
        run: |
          mkdir -p artifacts && chmod 777 artifacts
          set -euo pipefail
          run() { docker run --rm -v "$PWD/artifacts:/out" modeler-engine:ci "$@"; }
          echo "== golden round trip";  run Rscript /engine/golden/golden_roundtrip.R /engine/golden/example_snapshot.json /out/golden
          echo "== fitting smoke";      run Rscript /engine/golden/pi_smoke.R /out/pi_smoke
          echo "== engine tasks";       run Rscript /engine/golden/golden_tasks.R
          echo "== benchmark";          run Rscript /engine/benchmark.R "" "" 400 /out/benchmark.json
          # PK-Sim's own Weibull release curve: one published simulation dosing the OSP Dapagliflozin IC tablet
          mkdir -p artifacts/weibull && chmod 777 artifacts/weibull
          python3 - <<'PY'
          import json
          snap = json.load(open("services/engine-worker/golden/fixtures/Dapagliflozin-Model.json", encoding="utf-8"))
          snap["Simulations"] = [s for s in snap["Simulations"] if "IC tablet (Chang 2015)" in s["Name"]][:1]
          for key in ("ParameterIdentifications", "SimulationComparisons", "QualificationPlans"):
              snap.pop(key, None)
          assert snap["Simulations"], "no simulation of the IC tablet in the Dapagliflozin snapshot"
          json.dump(snap, open("artifacts/weibull/snapshot.json", "w", encoding="utf-8"))
          PY
          echo "== weibull curve";      run Rscript /engine/golden/weibull_check.R /out/weibull/snapshot.json /out/weibull
          # every golden script exited 0 (set -e); record the gate result for the registration step
          printf '{"roundtrip": true, "pi_smoke": true, "tasks": true}\n' > artifacts/golden.json

      - name: Install uv for the Weibull comparison
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Qualify — the platform's Weibull equation against PK-Sim's curve (within 1 %)
        run: |
          set -euo pipefail
          uv run --frozen --package pbpk-domain python services/engine-worker/golden/compare_weibull.py artifacts/weibull
          python3 - <<'PY'
          import json
          golden = json.load(open("artifacts/golden.json"))
          golden["weibull"] = json.load(open("artifacts/weibull/weibull_result.json"))["passed"]
          json.dump(golden, open("artifacts/golden.json", "w"))
          PY

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        id: push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="${IMAGE,,}"   # registry paths must be lowercase; the repository name (Modeler_One_AI) is not
          tag="${GITHUB_SHA::12}"
          docker tag modeler-engine:ci "$image:$tag"
          docker push "$image:$tag"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Syft)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.push.outputs.ref }}
          format: spdx-json
          output-file: artifacts/sbom.spdx.json

      - name: Sign image (cosign keyless)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - name: cosign sign
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      # modeler_engine.registration is pure-python (no engine needed); the record step runs it from the locked workspace
      # with uv, as CI does (a bare pip install into the runner's system Python can be refused, PEP 668).
      - name: Install uv for the record step
        if: github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"

      - name: Build engine_images registration record
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: |
          uv run --frozen --package modeler-engine-worker python - <<'PY'
          import json, os
          from modeler_engine.registration import build_engine_image_registration
          catalog = json.load(open("services/engine-worker/golden/catalog.json"))
          benchmark = json.load(open("artifacts/benchmark.json"))
          golden = json.load(open("artifacts/golden.json"))
          rec = build_engine_image_registration(
              digest="sha256:" + os.environ["DIGEST"].split(":")[-1],
              catalog=catalog, benchmark=benchmark, golden=golden,
              sbom_ref=os.environ["IMAGE_REF"],
          )
          json.dump(rec, open("artifacts/engine_image_registration.json", "w"), indent=2, sort_keys=True)
          print(json.dumps(rec, indent=2))
          PY

      - name: Upload qualification + registration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-image-evidence
          path: |
            artifacts/golden/**
            artifacts/pi_smoke/**
            artifacts/benchmark.json
            artifacts/sbom.spdx.json
            artifacts/engine_image_registration.json
          if-no-files-found: warn
