# The one module that writes each artifact kind and reads its stored content raw (test_artifact_owners.py). Everyone
# else asks the owner. brief_ops and map_artifact take over the writes in phase 6e (map_artifact is created then).
[owners]
document = "modeler_project.documents"
brief = "modeler_project.brief_ops"
requirements = "modeler_project.data_plan"
feasibility = "modeler_project.data_plan"
evidence = "modeler_project.evidence_register"
access_request = "modeler_project.evidence_register"
dataset = "modeler_project.dataset_register"
client_submission = "modeler_project.client_data"
dissolution = "modeler_project.dissolution_register"
cpf = "modeler_project.inputs"
study_catalog = "modeler_project.inputs"
readiness = "modeler_project.inputs"
model_plan = "modeler_project.plan"
map = "modeler_project.map_artifact"
campaign = ""  # nobody: P6 campaigns live in the runner's own store and are linked by reference

# Today's exceptions to [owners] (2026-10-08). Writers go in phase 6e, raw reads in 6e-6f; both lists only shrink.
[[owner_exceptions.writer]]
module = "modeler_api.brief_api"
kind = "brief"
reason = "the brief's edits, agent merge and approval-time writes; move to modeler_project.brief_ops in phase 6e"

[[owner_exceptions.writer]]
module = "modeler_api.inputs_api"
kind = "cpf"
reason = "the CPF/published hand-off record; moves to modeler_project.inputs in phase 6e"

[[owner_exceptions.writer]]
module = "modeler_api.plan_api"
kind = "map"
reason = "the signed MAP; moves to modeler_project.map_artifact in phase 6e"

# Raw stored-content reads outside the owner modules, per module (exact counts; lower one when reads go, drop it at 0).
[owner_exceptions.reads]
"modeler_agents.evidence_agent" = 7       # document metadata (sha256, name, pages, note)
"modeler_agents.observed_data_agent" = 2  # document metadata
"modeler_agents.proposal_intake" = 7      # document metadata
"modeler_api.brief_api" = 5               # document metadata
"modeler_api.client_api" = 4              # client submission (file, sha256), dataset state
"modeler_api.deps" = 1                    # model plan structure (blinding view)
"modeler_api.doctor" = 3                  # CPF and readiness
"modeler_api.evidence_api" = 2            # access requests, document sha256
"modeler_api.inputs_api" = 2              # CPF assembly, study catalog
"modeler_api.plan_api" = 10               # MAP (map, sha256, campaign, signature), study catalog, dissolution
"modeler_api.project_api" = 1             # dataset study
"modeler_project.blinding" = 4            # MAP signature, model plan placements, dataset purpose and study
