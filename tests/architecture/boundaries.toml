# The layer map and today's known exceptions, read by test_import_boundaries.py (docs/ARCHITECTURE_BOUNDARIES.md).
#
# LOCKED FILE (docs/architecture/locked-files.json). An exception is added only with the owner's approval, in its own
# PR with a CHANGELOG entry. When the code is fixed the exception must go: the test fails on an entry that no longer
# matches anything, so this list can only shrink.

# Import name -> layer. A package imports only itself or a lower layer; two packages on one layer do not import each
# other. Every workspace member must be placed here.
[layers]
pbpk_domain = 0           # L0 science: CPF, builder, MS-01, units
modeler_contracts = 1     # L1 typed DTOs and ports shared across processes
modeler_intake = 2        # L2 deterministic file reading
modeler_storage = 2       # L2 persistence: the Postgres audit trail (phase 3a), read models and repositories (3b)
modeler_project = 3       # L3 pipeline artifacts P0-P4 and their services
modeler_agents = 4        # L4 the LLM edge
modeler_orchestrator = 5  # L5 campaign runner
modeler_engine = 5        # L5 engine worker
modeler_api = 6           # L6 HTTP

# The one modeler_api module allowed to import each of these packages (the seams; phase 5b put every agent job behind its own).
[seams]
modeler_orchestrator = "modeler_api.execution"
modeler_agents = "modeler_api.agent_jobs"

# The only modules that read the process environment (os.environ, os.getenv, a pydantic BaseSettings): rule B5.
# Everything else receives its configuration from them.
[config]
readers = [
  "modeler_api.config",         # the API's Settings (pydantic-settings), injected as SettingsDep
  "modeler_contracts.runtime",  # the orchestrator's and engine worker's MODELER_* variables
  "modeler_agents.llm",         # provider settings; callers may pass their own mapping instead
  "modeler_agents.web_search",  # search settings; same
  "modeler_engine.runner",      # passes chosen variables through to the engine subprocess
]

# ---- known exceptions (2026-10-07; removed: 13 by phase 3b, 10 by 5a, 14 by 5b, 3 by 5c, 4 by 5d). rule: layer | declared | seam | router | tests ----

[[allow]]
rule = "layer"
importer = "modeler_orchestrator.local_runner"
imported = "modeler_engine.runner"
reason = "the local runner calls the engine runner in-process; goes behind an engine port in modeler_contracts"

[[allow]]
rule = "declared"
importer = "modeler_orchestrator"
imported = "modeler_engine"
reason = "lazy import in local_runner; goes behind an engine port with the layer exception above"

[[allow]]
rule = "tests"
importer = "packages/pbpk-domain/tests/test_cpf.py"
imported = "modeler_orchestrator"
reason = "a CPF test reaches into the orchestrator's _fittable_candidates; moves to the orchestrator tests in phase 5"

[[allow]]
rule = "tests"
importer = "services/engine-worker/tests/test_objectstore.py"
imported = "modeler_orchestrator"
reason = "the S3 object store lives in the orchestrator; moves with the engine port (after phase 3)"



