* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--ink); font: var(--fs-md)/1.5 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { color: var(--accent-hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
h1 { font-size: var(--fs-2xl); line-height: 1.25; margin: 0; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: var(--fs-lg); line-height: 1.35; margin: 0 0 var(--s2); font-weight: 600; }
h3 { font-size: var(--fs-md); margin: 0 0 var(--s1); font-weight: 600; }
p { margin: 0 0 var(--s2); }
.muted { color: var(--ink-3); }
.small { font-size: var(--fs-sm); }
.num-t { font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--surface); padding: 8px 12px; border: 2px solid var(--accent); border-radius: var(--r-md); }
.skip:focus { left: 8px; top: 8px; }
.ico { width: 16px; height: 16px; flex: 0 0 16px; display: inline-block; vertical-align: -3px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 14px; height: 14px; flex-basis: 14px; vertical-align: -2px; }

/* prototype furniture */
.proto-strip { height: var(--strip); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; white-space: nowrap; position: relative; z-index: 45;
  background: repeating-linear-gradient(135deg, #FFF6C9 0 10px, #FFF0B0 10px 20px); color: #4A3B00; border-bottom: 1px solid #E6D27A; }
.proto-strip a { color: #4A3B00; }
.proto-tag { display: inline-block; font: 500 11px/1 var(--mono); color: #6B5900; background: #FFF9DB; border: 1px dashed #D6BC3A; padding: 3px 6px; border-radius: 3px; }
.proto-controls { position: relative; display: inline-block; }
.proto-controls summary { cursor: pointer; font-weight: 600; text-decoration: underline; list-style: none; }
.proto-controls summary::-webkit-details-marker { display: none; }
.proto-controls summary::after { content: " ▾"; }
.proto-drop { position: absolute; right: 0; top: 20px; width: min(300px, calc(100vw - 16px)); background: #FFF9DB; border: 1.5px dashed #C9A800; border-radius: var(--r-md); padding: 8px 10px;
  font-size: 12.5px; color: #3A2F00; box-shadow: var(--shadow-2); white-space: normal; }
.proto-drop .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.proto-drop select { min-height: 28px; padding: 2px 6px; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--top); display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s4);
  background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; white-space: nowrap; margin-right: var(--s2); }
.brand svg { width: 26px; height: 26px; }
.topbar .grow { flex: 1; }
.tb-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 1px solid transparent; border-radius: var(--r-md);
  background: none; color: var(--ink-2); font: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
.tb-btn:hover { background: var(--surface-2); color: var(--ink); }
.tb-btn.outline { border-color: var(--border-2); min-width: 220px; justify-content: space-between; color: var(--ink-3); }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.count.zero { background: var(--surface-2); color: var(--ink-3); }
.count.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); display: inline-block; box-shadow: 0 0 0 3px var(--pass-bg); }
.dot.off { background: var(--control-edge); box-shadow: none; }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-tint); color: var(--accent); display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; }
.menu-btn { display: none; }
.popover { position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r-lg); padding: 6px; min-width: 280px; box-shadow: var(--shadow-2); }
.popover a, .popover button.item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border-radius: var(--r-sm); color: var(--ink); text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; }
.popover a:hover, .popover button.item:hover { background: var(--surface-2); }
.popover input { width: 100%; margin-bottom: 6px; }
.popover .sep { border-top: 1px solid var(--border); margin: 6px 0; }

/* shell */
.shell { display: flex; min-height: calc(100vh - var(--top) - var(--strip)); }
.sidenav { width: var(--nav); flex: 0 0 var(--nav); background: var(--surface); border-right: 1px solid var(--border); padding: var(--s3) 0 var(--s6);
  position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; }
.sidenav .back { display: flex; gap: 6px; align-items: center; padding: 2px var(--s4) var(--s2); font-size: var(--fs-sm); text-decoration: none; }
.sidenav .proj { padding: var(--s1) var(--s4) var(--s3); border-bottom: 1px solid var(--border); margin-bottom: var(--s2); }
.sidenav .proj strong { display: block; font-size: 15px; line-height: 1.3; }
.sidenav .group { padding: var(--s3) var(--s4) var(--s1); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.sidenav a.item { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px var(--s4) 6px 13px; border-left: 3px solid transparent; color: var(--ink-2); text-decoration: none; }
.sidenav a.item:hover { background: var(--surface-2); color: var(--ink); }
.sidenav a.item[aria-current="page"] { border-left-color: var(--accent); background: var(--accent-tint); color: var(--accent); font-weight: 600; }
.sidenav a.item.sub { padding-left: 39px; min-height: 30px; font-size: var(--fs-sm); }
.sidenav .si { width: 16px; display: inline-flex; justify-content: center; color: var(--ink-3); flex: 0 0 16px; }
.sidenav a.item[aria-current="page"] .si { color: var(--accent); }
.si.done { color: var(--pass) !important; } .si.needs { color: var(--warn) !important; }
.sidenav a.item .count { margin-left: auto; }
main { flex: 1; min-width: 0; padding: 0 var(--s6) 80px; }
main:focus { outline: none; }

/* page frame */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: var(--s4) 0 var(--s2); font-size: var(--fs-sm); color: var(--ink-3); }
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs span.sep { color: var(--ink-muted); display: inline-flex; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--s3); padding: 0 0 var(--s4); margin-bottom: var(--s4); border-bottom: 1px solid var(--border); }
.page-head .titles { flex: 1 1 360px; min-width: 0; }
.page-head .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); }
.page-head .desc { color: var(--ink-3); margin: 6px 0 0; max-width: 80ch; }
.page-head .actions { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.info-link { font-size: var(--fs-sm); background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 4px; font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* flash bar */
.flash { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border: 1px solid; border-left-width: 4px; border-radius: var(--r-md); margin-bottom: var(--s2); background: var(--surface); }
.flash > .ico { margin-top: 2px; }
.flash .x { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--ink-3); font-size: 18px; line-height: 1; padding: 0 2px; }
.flash.info { background: var(--info-bg); border-color: var(--info-line); border-left-color: var(--info); }
.flash.info > .ico { color: var(--info); }
.flash.ok { background: var(--pass-bg); border-color: var(--pass-line); border-left-color: var(--pass); }
.flash.ok > .ico { color: var(--pass); }
.flash.warn { background: var(--warn-bg); border-color: var(--warn-line); border-left-color: var(--warn); }
.flash.warn > .ico { color: var(--warn); }
.flash.err { background: var(--fail-bg); border-color: var(--fail-line); border-left-color: var(--fail); }
.flash.err > .ico { color: var(--fail); }
.flash .btn { margin-left: 8px; }

/* buttons and controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 14px; border: 1px solid var(--control-edge);
  border-radius: var(--r-md); background: var(--surface); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.btn.link { border-color: transparent; background: none; color: var(--accent); padding: 0 6px; }
.btn.link:hover { text-decoration: underline; background: none; }
.btn.danger { color: var(--fail); border-color: var(--fail); }
.btn.danger:hover { background: var(--fail-bg); }
.btn.small { min-height: 28px; padding: 0 10px; font-size: var(--fs-sm); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
input[type=text], input[type=search], input[type=number], input[type=email], input[type=password], input:not([type]), select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--control-edge); border-radius: var(--r-md); padding: 6px 10px; min-height: 34px; max-width: 100%; }
input::placeholder, textarea::placeholder { color: var(--ink-muted); }
input:hover, select:hover, textarea:hover { border-color: var(--ink-3); }
textarea { min-height: 80px; width: 100%; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }
.search { position: relative; display: inline-flex; align-items: center; }
.search .ico { position: absolute; left: 10px; color: var(--ink-3); pointer-events: none; }
.search input { padding-left: 32px; }
label.field { display: block; margin-bottom: var(--s4); }
label.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
label.field input:not([type=checkbox]):not([type=radio]), label.field select { width: 100%; }
label.field .hint { display: block; color: var(--ink-3); font-size: var(--fs-sm); font-weight: 400; margin-top: 4px; }
fieldset { border: 0; padding: 0; margin: 0 0 var(--s3); }
legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
.choice { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-md); margin-bottom: 6px; cursor: pointer; }
.choice:hover { border-color: var(--border-2); background: var(--surface-2); }
.choice input { margin-top: 3px; }
.err-text { color: var(--fail); font-size: var(--fs-sm); }

/* containers */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: var(--s4); box-shadow: var(--shadow-1); }
.panel > .ph { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); }
.panel > .ph h2 { margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel > .pb { padding: var(--s4); }
.panel > .pb.flush { padding: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: var(--s4); }
.cols.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px var(--s5); margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 500; }
.kv.cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); }
.kv.cols3 > div dt { font-size: var(--fs-sm); }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); }
.toolbar .grow { flex: 1; }
.toolbar input[type=search] { min-width: 260px; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px var(--s4); border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]:hover { color: var(--ink); }
th[data-sort]::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-right: 1.5px solid var(--border-2); border-bottom: 1.5px solid var(--border-2); transform: rotate(45deg) translateY(-3px); }
th[aria-sort="ascending"]::after { border-color: var(--accent); transform: rotate(-135deg) translate(-2px, -1px); }
th[aria-sort="descending"]::after { border-color: var(--accent); }
td.num, th.num { text-align: right; }
tbody tr:hover td { background: #FAFBFD; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
tr.selected td { background: var(--accent-tint) !important; box-shadow: inset 0 0 0 0 transparent; }
tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.table-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px var(--s4); color: var(--ink-3); font-size: var(--fs-sm); border-top: 1px solid var(--border); }
.pager { display: inline-flex; align-items: center; gap: 4px; }
.pager button { border: 1px solid transparent; background: none; border-radius: var(--r-sm); min-width: 28px; height: 28px; color: var(--ink-2); cursor: pointer; font: inherit; }
.pager button[aria-current="page"] { color: var(--accent); font-weight: 600; border-color: var(--border-2); }
.pager button:disabled { color: var(--border-2); cursor: default; }

/* status indicators (icon + word, never colour alone) */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; line-height: 20px; }
.badge .ico { width: 13px; height: 13px; flex-basis: 13px; stroke-width: 2; }
.b-missing { background: var(--fail-bg); color: var(--fail); }
.b-confirm, .b-decide { background: var(--warn-bg); color: var(--warn); }
.b-done, .b-pass, .b-low { background: var(--pass-bg); color: var(--pass); }
.b-medium { background: var(--warn-bg); color: var(--warn); }
.b-high, .b-fail { background: var(--fail-bg); color: var(--fail); }
.b-neutral { background: var(--surface-2); color: var(--ink-2); }
.b-accent { background: var(--accent-tint); color: var(--accent); }
.b-outline { border-color: var(--border-2); color: var(--ink-3); background: var(--surface); }
.spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--border-2); border-radius: var(--r-sm); font-size: 12px; color: var(--accent); background: var(--surface); cursor: pointer; font-family: var(--font); font-weight: 500; }
.chip:hover { background: var(--accent-tint); border-color: var(--accent-tint-2); }
.steps-mini { display: inline-flex; gap: 3px; vertical-align: middle; }
.steps-mini i { width: 20px; height: 6px; border-radius: 3px; background: var(--surface-3); display: inline-block; }
.steps-mini i.done { background: var(--pass); } .steps-mini i.needs { background: var(--warn); } .steps-mini i.prog { background: var(--accent); }

/* tabs and in-page navigation */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: var(--s4); overflow-x: auto; scrollbar-width: thin; }
.tabs a { padding: 10px 14px; color: var(--ink-2); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; font-weight: 500; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.inpage { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: var(--s4); align-items: start; }
.inpage nav { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 6px 0; position: sticky; top: calc(var(--top) + 16px); box-shadow: var(--shadow-1); }
.inpage nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 12px 7px 11px; color: var(--ink-2); text-decoration: none; border-left: 3px solid transparent; }
.inpage nav a:hover { background: var(--surface-2); }
.inpage nav a[aria-current="page"] { border-left-color: var(--accent); background: var(--accent-tint); color: var(--accent); font-weight: 600; }
.inpage nav a .badge { padding: 0 4px; background: none; border: 0; }

/* placeholders (only where hi-fi still does not draw: cards view) */
.ph-box { border: 1.5px dashed var(--control-edge); border-radius: var(--r-lg); min-height: 160px; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--ink-3); }
.ph-box strong { display: block; color: var(--ink-2); margin-bottom: 4px; }

/* charts */
.chart { position: relative; }
.chart-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s4); font-size: var(--fs-sm); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 2px; display: inline-block; border-radius: 1px; }
.legend i.dotk { width: 9px; height: 9px; border-radius: 50%; }
.chart svg { width: 100%; max-width: 860px; height: auto; display: block; overflow: visible; }
.chart svg text { font-family: var(--font); font-size: 11.5px; fill: var(--ink-3); }
.chart svg .lbl { fill: var(--ink-2); font-weight: 600; font-size: 12px; }
.chart .illus { position: absolute; right: 8px; top: 40px; font-size: 11px; color: var(--ink-3); background: rgba(255,255,255,.9); border: 1px dashed var(--border-2); border-radius: var(--r-sm); padding: 2px 6px; pointer-events: none; }
.chart .band line { opacity: 0; } .chart .band:hover line { opacity: 1; }
.tip { position: absolute; line-height: 1.5; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 8px; border-radius: var(--r-sm); white-space: nowrap; transform: translate(-50%, 0); z-index: 5; }
.seg { display: inline-flex; border: 1px solid var(--control-edge); border-radius: var(--r-md); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; font: inherit; font-size: var(--fs-sm); cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--control-edge); }
.seg button[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent); font-weight: 600; }

/* MS-01 canvas */
.canvas { display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr)); gap: var(--s2); overflow-x: auto; padding: var(--s3); background: var(--surface-2); border-radius: var(--r-lg); border: 1px solid var(--border); }
.lane { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); min-height: 150px; display: flex; flex-direction: column; }
.lane header { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.lane header strong { display: block; font-size: var(--fs-sm); }
.lane header span { font-size: 11.5px; color: var(--ink-3); }
.lane .drop { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.lane.blinded .drop { background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(100,116,139,.07) 8px 16px); }
.study { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--border-2); border-radius: var(--r-md); background: var(--surface); font-size: var(--fs-sm); cursor: grab; }
.study .grip { color: var(--ink-muted); letter-spacing: -2px; }
.study.moved { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.canvas-legend { display: flex; flex-wrap: wrap; gap: var(--s4); font-size: var(--fs-sm); color: var(--ink-3); margin-top: var(--s2); }

/* source viewers */
.docpage { background: #fff; border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 22px 24px; box-shadow: var(--shadow-1); position: relative; }
.docpage .ln { height: 8px; border-radius: 2px; background: #E5E9F0; margin: 9px 0; }
.docpage .hl { position: relative; outline: 2px solid var(--accent); outline-offset: 3px; background: var(--accent-tint); border-radius: 2px; padding: 2px 4px; font-size: 12.5px; color: var(--ink); }
.docbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: var(--fs-sm); color: var(--ink-3); }
.sheet { border-collapse: collapse; font-size: 12px; font-family: var(--mono); width: auto; }
.sheet th, .sheet td { border: 1px solid var(--border); padding: 3px 8px; position: static; }

.backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 50; display: grid; place-items: center; padding: var(--s4); }

.skel { height: 14px; border-radius: 3px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: sk 1.4s linear infinite; margin: 12px 0; }

/* charts: one y axis, thin marks, legend + direct labels, recessive grid, hover tooltip, table view (dataviz skill) */
let CHART_ID = 0;
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

/* ---------- split panel, dialogs, popovers ---------- */
const SPLITS = {};
function openSplit(name, arg) {
  const fn = SPLITS[name]; if (!fn) return;
  const s = fn(arg);
  $("#split-root").innerHTML = `<aside class="split" role="complementary" aria-label="${esc(s.title)}"><header><h2>${esc(s.title)}</h2>${s.actions || ""}<button class="btn small" data-split-close>Close</button></header><div class="body">${s.body}</div></aside>`;
  $("#split-root .split [data-split-close]").focus();
}
function closeSplit() { $("#split-root").innerHTML = ""; $$("tr.selected").forEach((r) => r.classList.remove("selected")); }

const DIALOGS = {};
let lastFocus = null;
function openDialog(name, arg) {
  const fn = DIALOGS[name]; if (!fn) return;
  const d = fn(arg);
  lastFocus = document.activeElement;
  $("#dialog-root").innerHTML = `<div class="backdrop" data-backdrop><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <header><h2 id="dlg-title">${esc(d.title)}</h2></header><div class="body">${d.body}<p class="err-text" id="dlg-err" hidden></p></div>
    <footer><button class="btn" data-dialog-cancel>${esc(d.cancel || "Cancel")}</button>${d.primary === false ? "" : `<button class="btn ${d.danger ? "danger" : "primary"}" data-dialog-ok>${esc(d.primary || "Save")}</button>`}</footer></div></div>`;
  const first = $("#dialog-root .dialog input, #dialog-root .dialog select, #dialog-root .dialog textarea, #dialog-root .dialog button");
  (first || $("#dialog-root .dialog")).focus();
  $("#dialog-root").dataset.name = name; $("#dialog-root").dataset.arg = arg || "";
}
function closeDialog() { $("#dialog-root").innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function dialogOk() {
  const name = $("#dialog-root").dataset.name; const d = DIALOGS[name]($("#dialog-root").dataset.arg);
  const reason = $("#dialog-root [data-required]");
  if (reason && !reason.value.trim()) { const e = $("#dlg-err"); e.hidden = false; e.textContent = reason.dataset.required; reason.focus(); return; }
  closeDialog();
  if (d.then) { d.then(); return; }
  pushFlash("ok", `<span><strong>${esc(d.done || "Done")}.</strong> Prototype only: nothing was saved or sent.</span>`);
}
function closePopover() { $("#popover-root").innerHTML = ""; $("#switcherBtn").setAttribute("aria-expanded", "false"); $("#userBtn").setAttribute("aria-expanded", "false"); }
function openPopover(anchor, html) {
  const r = anchor.getBoundingClientRect();
  $("#popover-root").innerHTML = `<div class="popover" style="top:${r.bottom + window.scrollY + 4}px;left:${Math.max(8, Math.min(r.left, window.innerWidth - 280))}px">${html}</div>`;
  anchor.setAttribute("aria-expanded", "true");
  const f = $("#popover-root input, #popover-root a, #popover-root button"); if (f) f.focus();
}

/* ---------- behaviours (event delegation) ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-dialog],[data-split],[data-split-close],[data-dialog-cancel],[data-dialog-ok],[data-backdrop],[data-help],[data-help-close],[data-dismiss],[data-retry],th[data-sort],#switcherBtn,#userBtn,#apiDot,#menuBtn,#resetBtn,[data-proto]");
  if (!t) { if (!e.target.closest(".popover")) closePopover(); return; }
  if (t.matches("[data-backdrop]") && e.target !== t) return;
  if (t.matches("[data-dialog]")) { e.preventDefault(); openDialog(t.dataset.dialog, t.dataset.arg); }
  else if (t.matches("[data-split]")) { e.preventDefault(); $$("tr.selected").forEach((r) => r.classList.remove("selected")); if (t.tagName === "TR") t.classList.add("selected"); openSplit(t.dataset.split, t.dataset.arg); }
  else if (t.matches("[data-split-close]")) closeSplit();
  else if (t.matches("[data-dialog-cancel],[data-backdrop]")) closeDialog();
  else if (t.matches("[data-dialog-ok]")) dialogOk();
  else if (t.matches("[data-help]")) { $("#help").hidden = false; $("#help [data-help-close]").focus(); }
  else if (t.matches("[data-help-close]")) { $("#help").hidden = true; }
  else if (t.matches("[data-dismiss]")) t.closest(".flash").remove();
  else if (t.matches("[data-retry]")) { STATE = "normal"; $("#stateSel").value = "normal"; render(); }
  else if (t.matches("th[data-sort]")) sortBy(t);
  else if (t.id === "menuBtn") { const o = $("#sidenav").classList.toggle("open"); t.setAttribute("aria-expanded", String(o)); }
  else if (t.id === "apiDot") pushFlash("ok", "<span><strong>The API answers.</strong> (Prototype: no request was made.)</span>");
  else if (t.id === "resetBtn") { store.set("mo-proto-role", "owner"); ROLE = "owner"; STATE = "normal"; $("#roleSel").value = "owner"; $("#stateSel").value = "normal"; location.hash = "#/"; render(); }
  else if (t.id === "switcherBtn") {
    if ($("#popover-root .popover")) { closePopover(); return; }
    openPopover(t, `<input type="search" placeholder="Find a project or drug" aria-label="Find a project" id="swq"><div id="swl">${switcherList("")}</div><div class="sep"></div><a href="#/projects">All projects</a>`);
  } else if (t.id === "userBtn") {
    if ($("#popover-root .popover")) { closePopover(); return; }
    openPopover(t, `<div class="small" style="padding:6px 10px"><strong>${esc(M.me)}</strong><br>${esc(M.company)}<br>${esc(ROLES[ROLE].label)}</div><div class="sep"></div><a href="#/help">Help</a><a href="#/signed-out">Sign out</a>`);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#dialog-root").innerHTML) closeDialog(); else if ($("#popover-root").innerHTML) closePopover(); else if ($("#split-root").innerHTML) closeSplit(); else if (!$("#help").hidden) $("#help").hidden = true; }
  if (e.key === "Enter" && e.target.matches("tr[data-split]")) e.target.click();
  if (e.key === "Tab" && $("#dialog-root").innerHTML) {
    const f = $$("#dialog-root input, #dialog-root select, #dialog-root textarea, #dialog-root button").filter((x) => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener("input", (e) => {
  if (e.target.matches("[data-filter]")) {
    const q = e.target.value.toLowerCase(); const tb = $(`#${e.target.dataset.filter} tbody`);
    $$("tr", tb).forEach((r) => { r.hidden = q && !r.textContent.toLowerCase().includes(q); });
  }
  if (e.target.id === "swq") $("#swl").innerHTML = switcherList(e.target.value);
});
function switcherList(q) {
  const list = activeProjects().filter((p) => `${p.name} ${p.drug}`.toLowerCase().includes(q.toLowerCase()));
  return list.length ? list.map((p) => `<a href="#/projects/${p.id}">${esc(p.name)} <span class="muted small">· ${esc(p.drug)}</span></a>`).join("") : '<p class="muted small" style="padding:6px 10px">No project matches.</p>';
}
function sortBy(th) {
  const table = th.closest("table"); const i = Array.from(th.parentNode.children).indexOf(th);
  const dir = th.getAttribute("aria-sort") === "ascending" ? "descending" : "ascending";
  $$("th", table).forEach((x) => x.removeAttribute("aria-sort")); th.setAttribute("aria-sort", dir);
  const rows = $$("tbody tr", table); const num = th.dataset.sort === "num";
  rows.sort((a, b) => {
    const x = a.children[i]?.textContent.trim() ?? ""; const y = b.children[i]?.textContent.trim() ?? "";
    const r = num ? (parseFloat(x.replace(/[^\d.-]/g, "")) || 0) - (parseFloat(y.replace(/[^\d.-]/g, "")) || 0) : x.localeCompare(y);
    return dir === "ascending" ? r : -r;
  });
  rows.forEach((r) => table.tBodies[0].appendChild(r));
}

(function init() {
  $("#roleSel").innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${k === ROLE ? "selected" : ""}>${esc(r.label)}</option>`).join("");
  $("#roleSel").addEventListener("change", (e) => { ROLE = e.target.value; store.set("mo-proto-role", ROLE); render(); });
  $("#stateSel").addEventListener("change", (e) => { STATE = e.target.value; render(); });
  window.addEventListener("hashchange", () => { render(); $("#main").focus({ preventScroll: true }); window.scrollTo(0, 0); });
  render();
})();
