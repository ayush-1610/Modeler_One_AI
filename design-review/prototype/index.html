  Low fidelity: layout, navigation, content and states. Mock data only. It calls no API, stores nothing but the

-->
<style>
:root {
  color-scheme: light;
  /* the approved palette (design-review/DECISIONS.md D-P1): 60 % neutral, 30 % structure, 10 % accent */
  --canvas: #F8FAFC; --surface: #FFFFFF; --surface-2: #F1F5F9;
  --border: #E2E8F0; --border-2: #CBD5E1; --control-edge: #7C8798;
  --ink: #0F172A; --ink-2: #334155; --ink-3: #475569; --ink-muted: #64748B;
  --accent: #001B94; --accent-hover: #00136B; --accent-tint: #EEF2FF; --on-accent: #FFFFFF;
  --pass: #17663A; --pass-bg: #E7F4EC; --warn: #9A4500; --warn-bg: #FDF1E4; --fail: #B3261E; --fail-bg: #FBEAE8;
  --info-bg: #EEF2FF;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --top: 48px; --nav: 240px; --strip: 24px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--font); }
a { color: var(--accent); }
a:hover { color: var(--accent-hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
h1 { font-size: 20px; line-height: 1.3; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 8px; font-weight: 650; }
h3 { font-size: 13.5px; margin: 0 0 6px; font-weight: 650; }
p { margin: 0 0 8px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.skip { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--surface); padding: 8px 12px; border: 1px solid var(--accent); }
.skip:focus { left: 8px; top: 8px; }

/* prototype-only furniture: hatched yellow, never part of the product */
.proto-strip { height: var(--strip); white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px;
  background: repeating-linear-gradient(135deg, #FFF6C9 0 10px, #FFF0B0 10px 20px); color: #4A3B00; border-bottom: 1px solid #E6D27A; }
.proto-tag { display: inline-block; font: 600 11px/1 var(--mono); color: #4A3B00; background: #FFF6C9; border: 1px dashed #C9A800; padding: 3px 6px; border-radius: 3px; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 650; white-space: nowrap; }
.logo-box { width: 22px; height: 22px; border: 1.5px dashed var(--control-edge); border-radius: 4px; display: grid; place-items: center; font-size: 9px; color: var(--ink-3); }
.topbar .grow { flex: 1; }
.tb-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid transparent; border-radius: 4px;
  background: none; color: var(--ink-2); font: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
.tb-btn:hover { background: var(--surface-2); color: var(--ink); }
.tb-btn.outline { border-color: var(--border-2); }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 650; }
.count.zero { background: var(--surface-2); color: var(--ink-3); }
.count.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); display: inline-block; }
.dot.off { background: var(--control-edge); }
.menu-btn { display: none; }
.popover { position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--border-2); border-radius: 6px; padding: 6px; min-width: 260px;
  box-shadow: 0 6px 20px rgba(15,23,42,.08); }
.popover a, .popover button.item { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 4px; color: var(--ink); text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; }
.popover a:hover, .popover button.item:hover { background: var(--surface-2); }
.popover input { width: 100%; margin-bottom: 6px; }
.popover .sep { border-top: 1px solid var(--border); margin: 6px 0; }

/* shell */
.shell { display: flex; min-height: calc(100vh - var(--top) - var(--strip)); }
.sidenav { width: var(--nav); flex: 0 0 var(--nav); background: var(--surface); border-right: 1px solid var(--border); padding: 12px 0 24px;
  position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; }
.sidenav .back { display: block; padding: 4px 16px 8px; font-size: 12.5px; text-decoration: none; }
.sidenav .proj { padding: 0 16px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.sidenav .proj strong { display: block; font-size: 14px; }
.sidenav .group { padding: 10px 16px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; }
.sidenav a.item { display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 13px; border-left: 3px solid transparent; color: var(--ink-2); text-decoration: none; }
.sidenav a.item:hover { background: var(--surface-2); color: var(--ink); }
.sidenav a.item[aria-current="page"] { border-left-color: var(--accent); background: var(--accent-tint); color: var(--accent); font-weight: 600; }
.sidenav a.item.sub { padding-left: 37px; }
.sidenav .si { width: 16px; text-align: center; font-size: 12px; color: var(--ink-3); flex: 0 0 16px; }
.sidenav a.item[aria-current="page"] .si { color: var(--accent); }
.si.done { color: var(--pass); } .si.needs { color: var(--warn); }
main { flex: 1; min-width: 0; padding: 0 24px 64px; }
main:focus { outline: none; }

/* page frame */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 6px; font-size: 12.5px; color: var(--ink-3); }
.crumbs a { text-decoration: none; }
.crumbs span.sep { color: var(--border-2); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; padding: 4px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.page-head .titles { flex: 1 1 360px; min-width: 0; }
.page-head .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.page-head .desc { color: var(--ink-3); margin: 4px 0 0; max-width: 80ch; }
.page-head .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.info-link { font-size: 12.5px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0 4px; font: inherit; text-decoration: underline; }

/* flash bar */
.flash { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid; border-radius: 4px; margin-bottom: 8px; }
.flash .x { margin-left: auto; background: none; border: 0; cursor: pointer; color: inherit; font-size: 16px; line-height: 1; }
.flash.info { background: var(--info-bg); border-color: #C7D2FE; color: var(--ink); }
.flash.ok { background: var(--pass-bg); border-color: #B7DEC5; }
.flash.warn { background: var(--warn-bg); border-color: #F1CFA6; }
.flash.err { background: var(--fail-bg); border-color: #F0BDB7; }
.flash strong { white-space: nowrap; }

/* buttons and controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 12px; border: 1px solid var(--control-edge);
  border-radius: 4px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 550; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.btn.link { border-color: transparent; background: none; color: var(--accent); padding: 0 6px; }
.btn.danger { color: var(--fail); border-color: var(--fail); }
.btn.small { min-height: 26px; padding: 0 8px; font-size: 12.5px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=search], input[type=number], input[type=email], input:not([type]), select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--control-edge); border-radius: 4px; padding: 5px 8px; min-height: 32px; max-width: 100%; }
textarea { min-height: 72px; width: 100%; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-weight: 600; margin-bottom: 4px; }
label.field .hint { display: block; color: var(--ink-3); font-size: 12.5px; font-weight: 400; margin-top: 2px; }
.err-text { color: var(--fail); font-size: 12.5px; }

/* containers */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
.panel > .ph { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.panel > .ph h2 { margin: 0; flex: 1; }
.panel > .pb { padding: 12px 14px; }
.panel > .pb.flush { padding: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 16px; }
.cols.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.toolbar .grow { flex: 1; }
.toolbar input[type=search] { min-width: 220px; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; font-weight: 650; white-space: nowrap; }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]::after { content: " ↕"; color: var(--border-2); }
th[aria-sort="ascending"]::after { content: " ↑"; color: var(--accent); }
th[aria-sort="descending"]::after { content: " ↓"; color: var(--accent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
tr.selected td { background: var(--accent-tint); }
.table-foot { display: flex; justify-content: space-between; gap: 8px; padding: 8px 14px; color: var(--ink-3); font-size: 12.5px; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.b-missing { background: var(--fail-bg); color: var(--fail); }
.b-confirm, .b-decide { background: var(--warn-bg); color: var(--warn); }
.b-done, .b-pass, .b-low { background: var(--pass-bg); color: var(--pass); }
.b-medium { background: var(--warn-bg); color: var(--warn); }
.b-high, .b-fail { background: var(--fail-bg); color: var(--fail); }
.b-neutral { background: var(--surface-2); color: var(--ink-2); }
.b-accent { background: var(--accent-tint); color: var(--accent); }
.b-outline { border-color: var(--border-2); color: var(--ink-3); background: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border: 1px solid var(--border-2); border-radius: 4px; font-size: 12px; color: var(--accent); background: var(--surface); cursor: pointer; font-family: var(--font); }
.chip:hover { background: var(--accent-tint); }
.steps-mini { display: inline-flex; gap: 3px; vertical-align: middle; }
.steps-mini i { width: 18px; height: 6px; border-radius: 2px; background: var(--border); display: inline-block; }
.steps-mini i.done { background: var(--pass); } .steps-mini i.needs { background: var(--warn); } .steps-mini i.prog { background: var(--accent); }

/* tabs and in-page nav */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; overflow-x: auto; }
.tabs a { padding: 8px 12px; color: var(--ink-2); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs a:hover { color: var(--ink); background: var(--surface-2); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.inpage { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.inpage nav { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 0; position: sticky; top: calc(var(--top) + 12px); }
.inpage nav a { display: flex; justify-content: space-between; gap: 6px; padding: 6px 12px; color: var(--ink-2); text-decoration: none; border-left: 3px solid transparent; }
.inpage nav a:hover { background: var(--surface-2); }
.inpage nav a[aria-current="page"] { border-left-color: var(--accent); background: var(--accent-tint); color: var(--accent); font-weight: 600; }

/* placeholders: what the wireframe does not draw */
.ph-box { border: 1.5px dashed var(--control-edge); border-radius: 6px; min-height: 180px; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--ink-3);
  background: repeating-linear-gradient(45deg, transparent 0 12px, rgba(100,116,139,.06) 12px 24px); }
.ph-box strong { display: block; color: var(--ink-2); margin-bottom: 4px; }

/* states */
.skel { height: 14px; border-radius: 3px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: sk 1.4s linear infinite; margin: 10px 0; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.empty { text-align: center; padding: 40px 16px; color: var(--ink-3); }
.empty h2 { color: var(--ink); }

/* help panel and split panel */
.help { width: 320px; flex: 0 0 320px; background: var(--surface); border-left: 1px solid var(--border); padding: 12px 16px; position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; }
.help header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.split { position: fixed; right: 0; top: calc(var(--top) + var(--strip)); bottom: 0; width: min(480px, 100vw); z-index: 25; background: var(--surface); border-left: 1px solid var(--border-2);
  box-shadow: -6px 0 18px rgba(15,23,42,.06); display: flex; flex-direction: column; }
.split header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.split header h2 { margin: 0; flex: 1; }
.split .body { padding: 12px 14px; overflow-y: auto; flex: 1; }

/* dialogs */
.backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 6px; width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; border: 1px solid var(--border-2); }
.dialog header { padding: 14px 16px 8px; }
.dialog .body { padding: 4px 16px 12px; overflow-y: auto; }
.dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }

/* prototype controls */
.proto-strip { position: relative; z-index: 45; }
.proto-controls { position: relative; display: inline-block; }
.proto-controls summary { cursor: pointer; font-weight: 650; text-decoration: underline; list-style: none; }
.proto-controls summary::-webkit-details-marker { display: none; }
.proto-controls summary::after { content: " ▾"; }
.proto-drop { position: absolute; right: 0; top: 20px; width: min(300px, calc(100vw - 16px)); background: #FFF9DB; border: 1.5px dashed #C9A800; border-radius: 6px; padding: 8px 10px;
  font-size: 12.5px; color: #3A2F00; box-shadow: 0 6px 20px rgba(15,23,42,.12); }
@media (max-width: 640px) { .proto-strip { overflow: hidden; } .proto-drop { position: fixed; right: 8px; top: 26px; } }
.proto-controls .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.proto-controls select { min-height: 28px; padding: 2px 6px; }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--border); border-radius: 6px; padding: 12px; background: var(--surface); }
.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain li { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.list-plain li:last-child { border-bottom: 0; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.warn > i { background: var(--warn); }
.print-page { max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); padding: 40px 48px; }
.mb0 { margin-bottom: 0; } .mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .gap8 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

@media (max-width: 1100px) { .help { position: fixed; right: 0; top: calc(var(--top) + var(--strip)); bottom: 0; height: auto; z-index: 26; box-shadow: -6px 0 18px rgba(15,23,42,.08); } }
@media (max-width: 1024px) {
  .menu-btn { display: inline-flex; }
  .sidenav { position: fixed; left: 0; top: calc(var(--top) + var(--strip)); height: calc(100vh - var(--top) - var(--strip)); z-index: 35; transform: translateX(-100%); transition: transform .15s; }
  .sidenav.open { transform: none; box-shadow: 6px 0 18px rgba(15,23,42,.12); }
  .cols, .cols.even { grid-template-columns: minmax(0, 1fr); }
  .inpage { grid-template-columns: minmax(0, 1fr); }
  .inpage nav { position: static; display: flex; overflow-x: auto; padding: 0; }
  .inpage nav a { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; }
  .inpage nav a[aria-current="page"] { border-bottom-color: var(--accent); }
}
@media (max-width: 640px) {
  main { padding: 0 16px 96px; }
  .topbar { padding: 0 8px; gap: 4px; }
  .topbar .hide-sm, .proto-strip .hide-sm { display: none; }
  .toolbar input[type=search] { min-width: 0; width: 100%; }
  .print-page { padding: 20px 16px; }
}
@media print { .proto-strip, .topbar, .sidenav, .proto-controls, .crumbs, .page-head .actions, .help { display: none !important; } main { padding: 0; } .print-page { border: 0; } }
</style>

<script>
"use strict";
/* ============================================================================================================
   Core: helpers, roles, mock data, shell, router, behaviours. Pages are in the next section.
   ============================================================================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },

const DIALOGS = {};

  if (reason && !reason.value.trim()) { const e = $("#dlg-err"); e.hidden = false; e.textContent = reason.dataset.required; reason.focus(); return; }

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#dialog-root").innerHTML) closeDialog(); else if ($("#popover-root").innerHTML) closePopover(); else if ($("#split-root").innerHTML) closeSplit(); else if (!$("#help").hidden) $("#help").hidden = true; }
  if (e.key === "Enter" && e.target.matches("tr[data-split]")) e.target.click();
  if (e.key === "Tab" && $("#dialog-root").innerHTML) {
    const f = $$("#dialog-root input, #dialog-root select, #dialog-root textarea, #dialog-root button").filter((x) => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener("input", (e) => {
  if (e.target.matches("[data-filter]")) {
    const q = e.target.value.toLowerCase(); const tb = $(`#${e.target.dataset.filter} tbody`);
    $$("tr", tb).forEach((r) => { r.hidden = q && !r.textContent.toLowerCase().includes(q); });
  }
  if (e.target.id === "swq") $("#swl").innerHTML = switcherList(e.target.value);
});
function switcherList(q) {
  const list = activeProjects().filter((p) => `${p.name} ${p.drug}`.toLowerCase().includes(q.toLowerCase()));
  return list.length ? list.map((p) => `<a href="#/projects/${p.id}">${esc(p.name)} <span class="muted small">· ${esc(p.drug)}</span></a>`).join("") : '<p class="muted small" style="padding:6px 10px">No project matches.</p>';
}
function sortBy(th) {
  const table = th.closest("table"); const i = Array.from(th.parentNode.children).indexOf(th);
  const dir = th.getAttribute("aria-sort") === "ascending" ? "descending" : "ascending";
  $$("th", table).forEach((x) => x.removeAttribute("aria-sort")); th.setAttribute("aria-sort", dir);
  const rows = $$("tbody tr", table); const num = th.dataset.sort === "num";
  rows.sort((a, b) => {
    const x = a.children[i]?.textContent.trim() ?? ""; const y = b.children[i]?.textContent.trim() ?? "";
    const r = num ? (parseFloat(x.replace(/[^\d.-]/g, "")) || 0) - (parseFloat(y.replace(/[^\d.-]/g, "")) || 0) : x.localeCompare(y);
    return dir === "ascending" ? r : -r;
  });
  rows.forEach((r) => table.tBodies[0].appendChild(r));
}

(function init() {
  $("#roleSel").innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${k === ROLE ? "selected" : ""}>${esc(r.label)}</option>`).join("");
  $("#roleSel").addEventListener("change", (e) => { ROLE = e.target.value; store.set("mo-proto-role", ROLE); render(); });
  $("#stateSel").addEventListener("change", (e) => { STATE = e.target.value; render(); });
  window.addEventListener("hashchange", () => { render(); $("#main").focus({ preventScroll: true }); window.scrollTo(0, 0); });
  render();
})();
