[project]
name = "modeler-agents"
version = "0.1.0"
description = "Claude-powered proposal agents for Modeler One (parameter curation, drafting)"
requires-python = ">=3.12"
dependencies = [
  "anthropic[mcp]>=0.116",
  "httpx>=0.27",
  "mcp>=1.0",
  "pydantic>=2.11",
  "modeler-intake",
  "modeler-project",
]

[tool.uv.sources]
modeler-intake = { workspace = true }
modeler-project = { workspace = true }

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]"]
vertex = ["anthropic[vertex]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler_agents"]
