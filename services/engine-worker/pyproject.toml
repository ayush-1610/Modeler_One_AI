[project]
name = "modeler-engine-worker"
version = "0.1.0"
description = "Temporal activity worker that runs OSP Suite (ospsuite R) jobs in an isolated engine container"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.7",
  "modeler-contracts",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[tool.uv.sources]
modeler-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler_engine"]
