[project]
name = "modeler-api"
version = "0.1.0"
description = "Modeler One REST API: models, runs, ICH M15, signatures, audit"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pydantic-settings>=2.4",
  "temporalio>=1.7",
  "pbpk-domain",
  "modeler-contracts",
]

[tool.uv.sources]
pbpk-domain = { workspace = true }
modeler-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler_api"]
