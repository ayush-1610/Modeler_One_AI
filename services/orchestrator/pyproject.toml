[project]
name = "modeler-orchestrator"
version = "0.1.0"
description = "Temporal workflows for Modeler One runs, population fan-out, and review gates"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.7",
  "modeler-contracts",
  "pbpk-domain",
  "modeler-api",
  "modeler-agents",
  "boto3>=1.35",
  "pypandoc-binary>=1.17",
  "typst>=0.15.0",
]

[tool.uv.sources]
modeler-contracts = { workspace = true }
pbpk-domain = { workspace = true }
modeler-api = { workspace = true }
modeler-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler_orchestrator"]
