# Local development stack. Not a deployment profile: production runs on Kubernetes via Helm.
# Pin every image by digest before sharing this file beyond local development.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: modeler
      POSTGRES_PASSWORD: modeler
      POSTGRES_DB: modeler
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: modeler
      MINIO_ROOT_PASSWORD: modeler-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
    volumes: [temporal:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]

  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    environment:
      MODELER_DATABASE_URL: postgresql+asyncpg://modeler:modeler@postgres:5432/modeler
      MODELER_TEMPORAL_ADDRESS: temporal:7233
    ports: ["8000:8000"]
    depends_on: [postgres, temporal]

  engine-worker:
    build: {context: ., dockerfile: services/engine-worker/Dockerfile}
    profiles: [engine]
    environment:
      MODELER_TEMPORAL_ADDRESS: temporal:7233
      MODELER_RESOURCE_CLASS: s
      MODELER_ENGINE_ID: ospsuite-dev
    network_mode: bridge   # production engine pods run with egress denied by network policy
    depends_on: [temporal]

volumes:
  pgdata:
  minio:
  temporal:
