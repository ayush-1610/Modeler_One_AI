[project]
name = "modeler-storage"
version = "0.1.0"
description = "Persistence shared by the API and the orchestrator: the Postgres audit trail, read models, repositories"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pydantic>=2.11",
  "boto3>=1.35",
  "pbpk-domain",
  "modeler-contracts",
]

[tool.uv.sources]
pbpk-domain = { workspace = true }
modeler-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler_storage"]
