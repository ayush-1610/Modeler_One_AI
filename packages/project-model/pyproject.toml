[project]
name = "modeler-project"
version = "0.1.0"
description = "Project start-up pipeline (P0-P6): versioned artifacts, dependency graph, staleness, impact, audit, brief, requirements, evidence, plan"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "pyyaml>=6",
  "httpx>=0.27",
  "rdkit>=2024.9",
  "pbpk-domain",
  "modeler-intake",
]

[tool.uv.sources]
pbpk-domain = { workspace = true }
modeler-intake = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler_project"]
