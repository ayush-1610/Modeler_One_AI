[project]
name = "modeler-intake"
version = "0.1.0"
description = "Client data intake: raw vault, spreadsheet grids with cell provenance, mapping recipes, validation, canonical records"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "pydantic>=2.11",
  "pbpk-domain",
]

[tool.uv.sources]
pbpk-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler_intake"]
