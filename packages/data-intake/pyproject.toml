[project]
name = "modeler-intake"
version = "0.1.0"
description = "Client data intake: raw vault, spreadsheet grids with cell provenance, mapping recipes, validation, canonical records"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "pydantic>=2.11",
  "pbpk-domain",
  "xlrd>=2.0.1",
  "pdfplumber>=0.11",
  "rapidocr-onnxruntime>=1.4.4",
  "pypdfium2>=4.30",
  "pillow>=10",
  "opencv-python-headless>=4.10",
  "pyreadstat>=1.2",
  "python-pptx>=1.0",
  "numbers-parser>=4.10",
]

[tool.uv.sources]
pbpk-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler_intake"]
